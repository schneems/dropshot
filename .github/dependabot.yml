#
# Dependabot configuration file
#

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      # Update transitive dependencies too.
      - dependency-type: "all"
    open-pull-requests-limit: 20
    ignore:
      - dependency-name: "schemars"
        versions: [">=0.9.0"]
